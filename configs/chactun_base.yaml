# Chactun ancient Maya structure detection -- settings shared by every arm.
#
# Merged ON TOP OF a model-zoo config, which differs by arm (see
# scripts/train_chactun.py ARMS). Only deltas live here so the zoo base stays
# traceable upstream. Arms A, B and C then apply one delta each on top of this,
# so that any difference between their results is attributable to that delta and
# nothing else.
#
# THE COMPARISON THIS EXISTS TO SERVE
#   A  Mask R-CNN,    anchors [32,64,128,256,512]   (detectron2 default)
#   B  Mask R-CNN,    anchors [16,32,64,128,256]    A vs B isolates anchor scale
#   C  Cascade R-CNN, anchors [16,32,64,128,256]    B vs C isolates the head
#
# Every other setting is pinned here precisely so it cannot drift between arms.

DATASETS:
  # Overwritten per fold by train_chactun.py --fold. Named here so the config is
  # runnable standalone and so the default is explicit rather than implied.
  TRAIN: ("chactun_fold0_train",)
  TEST: ("chactun_fold0_val",)

DATALOADER:
  NUM_WORKERS: 8

  # 661 of 2094 tiles carry no annotation at all, and detectron2 DROPS such
  # images by default. Leaving this True would silently discard 31.6% of the
  # dataset. They are the negatives: a survey area is mostly not structures, and
  # a model never shown empty terrain has no way to learn what is not a building.
  FILTER_EMPTY_ANNOTATIONS: False

MODEL:
  ROI_HEADS:
    NUM_CLASSES: 3        # building, platform, aguada
    BATCH_SIZE_PER_IMAGE: 512

  # MEASURED over all 2094 tiles, not inherited. The zoo default is ImageNet BGR
  # [103.53, 116.28, 123.675] with PIXEL_STD [1,1,1], which for these bands would
  # present input off-centre by 4.2 to 5.0 standard deviations with no variance
  # scaling at all.
  #
  # Order is the STORED band order -- sky-view factor, positive openness, slope.
  # These are not colour channels and are not interchangeable; the order here
  # must stay aligned with detlab.datasets.chactun.load_image.
  PIXEL_MEAN: [216.527, 198.453, 228.612]
  PIXEL_STD: [26.915, 16.698, 21.212]

SOLVER:
  IMS_PER_BATCH: 16       # carried over from the SpaceNet throughput sweep

  BASE_LR: 0.02
  WARMUP_ITERS: 500       # 12.5% of the schedule; the SpaceNet value of 1000
                          # would be a quarter of this much shorter run

  # MEASURED on two pilot runs of arm A / fold 0, not reasoned from epoch counts.
  #
  # A 4000-iteration run with decay at (2800, 3600) peaks at iteration 2999 --
  # immediately after the first decay -- and declines from there:
  #
  #     iter    segm AP   AP50   building  platform  aguada
  #     2499     33.98    63.45     34.52     48.47   18.95
  #     2999     40.33    65.15     37.47     49.38   34.15   <- peak
  #     3499     39.93    64.90     37.01     48.95   33.84
  #     4000     39.15    64.43     36.91     47.95   32.59
  #
  # Everything after 3000 is dead: the second decay at 3600 changes nothing and
  # the tail drifts down. So the schedule stops at 3000 with a single decay.
  #
  # A 2000-iteration run with decay at (1400, 1800) was also tried, to test
  # whether the flat stretch from 1000 to 2500 could be cut. It cannot, and the
  # reason is instructive: that stretch is flat in AGGREGATE AP only. Building
  # and platform have converged by iteration 999, while aguada is still climbing
  # (13.7 -> 14.6 -> 14.5 -> 19.0) and only jumps at the decay. Decaying early
  # catches the rare class mid-climb:
  #
  #                  segm AP   building  platform  aguada
  #     2000 iters     38.13      39.92     51.33   23.15
  #     3000 iters     40.33      37.47     49.38   34.15
  #
  # The short schedule is BETTER on both common classes and 9.4 AP worse on
  # aguada. The rare class sets the schedule, which is also why it is not
  # dropped: at 76 instances it is underpowered per fold, not unlearnable.
  MAX_ITER: 3000
  STEPS: (2800,)

  # Only model_final is wanted. 21 runs times mid-run checkpoints would cost
  # tens of GB for artefacts nothing reads.
  CHECKPOINT_PERIOD: 100000

  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 500        # eight points on the trajectory, and it brackets the
                          # LR decay at 2800

INPUT:
  MASK_FORMAT: "polygon"

  # The mapper reads bands itself and never reorders them; this is set so that
  # no other part of detectron2 decides to flip them on its behalf.
  FORMAT: "RGB"

  # MIN_SIZE_TRAIN/TEST left at the zoo defaults (640-800 train, 800 test)
  # against native 480 tiles. This is held constant across all three arms
  # deliberately: input scale and anchor scale are two routes to the same
  # coverage problem, and varying both would make A vs B uninterpretable.
  # At 800 the median building is 41.6 px and 31.8% of buildings still fall
  # below a 32 px anchor, which is the residue arm B addresses.

# Training RNG only. NOT the fold assignment, which is fixed in
# data/chactun/splits/folds5.json and must stay fixed across every run, or seed
# variance and fold variance become inseparable.
SEED: 0
